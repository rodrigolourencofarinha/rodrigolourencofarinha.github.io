<!-- Author Box -->
{% if page.author %}
{% if site.authorbox == "enabled" %}
<div class="authorbox mb-5 mt-5 pt-4 pb-4">   
    <div class="row">
        <div class="wrapavname col-md-3 text-center">
            {% if author.gravatar %}
            <img class="author-thumb" src="https://www.gravatar.com/avatar/{{ author.gravatar }}?s=250&amp;d=mm&amp;r=x" alt="{{ author.display_name }}" width="70" height="70">
            {% else %}
            <img class="author-thumb" src="{{site.baseurl}}/{{ author.avatar }}" alt="{{ author.display_name }}" width="70" height="70">
            {% endif %}
            <p class="mt-4 mb-0 small text-center">
                <a target="_blank" rel="noopener" class="d-inline-block mx-1 text-dark" href="{{ author.web }}" aria-label="Website"><i class="fa fa-link" aria-hidden="true"></i></a>
                <a target="_blank" rel="noopener" class="d-inline-block mx-1 text-dark" href="{{ author.twitter }}" aria-label="X profile"><i class="fab fa-x-twitter" aria-hidden="true"></i></a>
                <a class="d-inline-block mx-1 text-dark" href="mailto:{{ author.email }}" aria-label="Email Rodrigo Farinha"><i class="fa fa-envelope" aria-hidden="true"></i></a>
            </p>
        </div>
        <div class="col-md-9">
            <h4>{{ author.display_name }}</h4>
            <p class="mt-3 mb-0">{{ author.description }}</p>
        </div>
    </div> 
</div> 
{% endif %}
{% endif %}
