{% assign substack_post = include.post %}
<article class="blog-grid-item">
  <div class="card h-100">
    <div class="maxthumb">
      <a href="{{ substack_post.url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ substack_post.title | escape }} on Substack (opens in a new tab)">
        <img class="img-thumb"
             src="{{ substack_post.image }}"
             alt=""
             width="1200"
             height="675"
             loading="lazy"
             decoding="async">
      </a>
    </div>

    <div class="card-body">
      <h3 class="card-title">
        <a class="text-dark"
           href="{{ substack_post.url }}"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="{{ substack_post.title | escape }} on Substack (opens in a new tab)">{{ substack_post.title }}</a>
      </h3>
      <p class="card-text">{{ substack_post.description }}</p>
    </div>

    <div class="card-footer bg-white">
      <div class="wrapfooter">
        <span class="meta-footer-thumb" aria-hidden="true">
          <img class="author-thumb"
               src="{{ site.baseurl }}/{{ site.authors.rodrigo.avatar }}"
               alt=""
               width="40"
               height="40"
               loading="lazy"
               decoding="async">
        </span>
        <span class="author-meta">
          <span class="post-name font-weight-bold">{{ site.authors.rodrigo.display_name | default: site.name }}</span>
          <time class="post-date" datetime="{{ substack_post.date }}">{{ substack_post.date | date: "%d %b %Y" }}</time>
        </span>
      </div>
    </div>
  </div>
</article>
