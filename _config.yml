# Site
name: "Rodrigo Farinha"
title: "Rodrigo Farinha"
tagline: "Quantitative Marketing, Innovation & AI"
description: "Rodrigo Farinha is a quantitative marketing scholar and consultant researching marketing strategy, product innovation, applied econometrics, and artificial intelligence."
logo: 'assets/images/rodrigo_farinha_profile.jpg'
favicon: 'assets/images/favicon.ico' # Update with actual path later
baseurl: "" # Set for root deployment
url: "https://rodrigofarinha.com" # Canonical site URL for sitemap/SEO
lang: en
locale: en_US
assets_version: 20260802221500
google_analytics: 'G-GETFNJX2YC' # Add Rodrigo's GA ID if provided
# Disqus deprecated in favor of Giscus
disqus: ''
# Giscus configuration (GitHub Discussions-based comments)
giscus:
  repo: 'rodrigolourencofarinha/rodrigolourencofarinha.github.io'            # e.g., owner/repo
  repo_id: 'R_kgDOM-fc0g'         # optional, from Giscus setup
  category: 'General'        # e.g., Announcements (name)
  category_id: 'DIC_kwDOM-fc0s4Cutth'     # optional, from Giscus setup
  mapping: 'pathname' # pathname | url | title | og:title | specific
  strict: 0           # 0 | 1
  reactions_enabled: 1# 0 | 1
  emit_metadata: 0    # 0 | 1
  input_position: 'bottom' # top | bottom
  theme: 'preferred_color_scheme'      # light | dark | preferred_color_scheme | etc.
  lang: 'en'          # interface language
mailchimp-list: '' # Add Rodrigo's Mailchimp list if provided

# Writing is published on Substack and rendered here from curated build-time data.
substack_feed_url: 'https://rodrigofarinha.substack.com/feed'
substack_publication_url: 'https://rodrigofarinha.substack.com'
include: ["_pages"]
permalink: /:title/
email: 'rodrigo.farinha@tuta.io' # Add Rodrigo's email if provided

# SEO identity
author:
  name: Rodrigo Farinha
  url: https://rodrigofarinha.com/
  twitter: rodrigofarinha
  type: Person
twitter:
  username: rodrigofarinha
  card: summary_large_image
social:
  name: Rodrigo Farinha
  links:
    - https://www.linkedin.com/in/rodrigolourencofarinha/
    - https://orcid.org/0000-0002-3364-8642
    - https://scholar.google.com/citations?user=uG2NW7sAAAAJ
    - https://github.com/rodrigolourencofarinha
    - https://x.com/rodrigofarinha
    - https://substack.com/@rodrigofarinha
    - https://eaesp.fgv.br/pessoa/rodrigo-lourenco-farinha
    - https://www.researchgate.net/profile/Rodrigo-Farinha
    - http://lattes.cnpq.br/3155038714631364

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/rodrigo_farinha_profile.jpg
        width: 1200
        height: 1200
        alt: Rodrigo Farinha

# Authors
authors:
  rodrigo:
    name: Rodrigo Farinha
    display_name: Rodrigo Farinha
    avatar: 'assets/images/rodrigo_farinha_2024_round.webp'
    email: 'rodrigo.farinha@tuta.io' 
    web: 'https://rodrigofarinha.com' 
    twitter: 'https://x.com/rodrigofarinha'
    linkedin: 'https://www.linkedin.com/in/rodrigolourencofarinha'
    github: 'https://github.com/rodrigolourencofarinha'
    scholar: 'https://scholar.google.com/citations?user=uG2NW7sAAAAJ&hl=en'
    orcid: 'https://orcid.org/0000-0002-3364-8642'
    substack: 'https://rodrigofarinha.substack.com'
    cv_page: '/cv/'
    cv_pdf: '/assets/pdf/Rodrigo_Farinha_CV.pdf'
    description: "Quantitative marketing scholar and management consultant focused on marketing strategy, product innovation, applied econometrics, and artificial intelligence."

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Other
highlighter: rouge # Changed from none to enable syntax highlighting
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Home layout options
home_hero: false

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: ""
adsense-data-ad-slot: ""

# Post Author Box ("enabled" or "disabled")
authorbox: "enabled"

# Sass
sass:
  sass_dir: _sass
  style: compressed
  sourcemap: never

exclude:
  - changelog.md
  - LICENSE.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  - Gemfile.lock.bak
  - docker-compose.yml
  - site
  - output
  - package.json
  - package-lock.json
  - to-do.md
  - rodrigolourencofarinha.github.io.code-workspace
  - .DS_Store
  - feed.xml
  - assets/css/prism.css
  - assets/js/jquery.min.js
  - assets/js/lazyload.js
  - assets/js/lunr.js
  - assets/js/lunrsearchengine.js
  - assets/js/prism.js
  - assets/js/substack-feed.js
